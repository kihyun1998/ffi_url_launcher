name: ffi_url_launcher
description: >-
  Open a URL in the system's registered handler on Windows and macOS. Pure Dart,
  with no Flutter dependency and no native sources to compile.
version: 0.1.1
repository: https://github.com/kihyun1998/ffi_url_launcher
issue_tracker: https://github.com/kihyun1998/ffi_url_launcher/issues

# Declared so pub.dev states the support rather than leaving a Dart CLI author to
# infer it from the README. Matching sibling `just_font_scan`, which is the same
# shape of package — pure-Dart FFI, Windows and macOS, no plugin.
#
# **This is the platform claim the dependency invariant protects.** A dependency
# declaring `platforms: windows:` would contradict this block while leaving every
# gate green but `tool/check_dependencies.dart` (`docs/agents/lessons.md` #1).
platforms:
  windows:
  macos:

topics:
  - url-launcher
  - ffi
  - windows
  - macos
  - desktop

environment:
  # **The floor a consumer inherits, and it is measured rather than scaffolded.**
  # `dart create` wrote `^3.11.5` here — whatever SDK happened to be installed —
  # and it stayed untouched from the initial commit through 0.1.0, four minor
  # versions above anything this package needs. A caret range carries that floor
  # straight down to every consumer, so it was silently demanding an SDK upgrade
  # of anyone adopting it.
  #
  # **3.10.0 is a measured boundary, not a compromise.** It is where macOS
  # `[NSURL URLWithString:]` stops running in a strict RFC 3986 mode that refuses
  # non-ASCII *and spaces*; 3.9.0 and older accept only percent-encoded input.
  # Measured exactly across 3.8.0 / 3.9.0 / 3.10.0 / 3.11.5 / stable on one macOS
  # image (`docs/agents/lessons.md` #13).
  #
  # **Why the boundary rather than the widest range that resolves.**
  # `package:ffi` would allow 3.7.0, and the public API is safe even there —
  # every backend hands over `url.toString()`, which percent-encodes exactly what
  # the strict mode wants, verified 7/7 on 3.9.0. But a caller reaching a backend
  # directly through `UrlLauncher.withBackend` bypasses `Uri`, so below 3.10.0
  # the package's behaviour depends on *how* it is called. Stopping at the
  # boundary makes it uniform on every supported SDK, and removes a caveat the
  # README would otherwise have to carry.
  #
  # The previous value was `^3.11.5`, which `dart create` wrote and nobody chose
  # — four minor versions above anything the package uses. Flutter terms:
  # 3.11.5 is Flutter 3.41.9, 3.10.0 is Flutter 3.38.2.
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  # The allocator and UTF-16 marshalling `dart:ffi` does not ship. Pure Dart,
  # maintained by the Dart team, and the only runtime dependency — deliberately
  # not `package:win32`, which declares `platforms: windows:` (misstating this
  # package's support) and would pull in thousands of generated bindings to call
  # four functions.
  ffi: ^2.1.4

dev_dependencies:
  # **Ranged, not carets, so this repo's own gates can run on its declared
  # floor.** `lints: ^6.0.0` needs an SDK newer than 3.7.0, which meant the CI
  # leg that proves the floor could not even `pub get` — a floor nothing can
  # execute is a claim, not a guarantee. This range lets pub pick 6.x on a
  # current SDK and 5.1.1 on the floor, so both legs resolve.
  #
  # Dev-only either way: a consumer never resolves these, so they constrain what
  # *we* can verify, never what a consumer can use.
  lints: ">=5.1.1 <7.0.0"
  test: ^1.25.6
